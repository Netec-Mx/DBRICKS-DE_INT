lab1:
  results:
  - '**Resultado esperado:** Cluster All-Purpose Single node con Databricks Runtime 15.4 LTS, acceso Standard y
    terminación automática de 20 minutos, en estado Running.'
  - '**Resultado esperado:** Notebook Python `batch_1/01_etl_basico` conectado al cluster; Spark 3.5.0 verificado,
    introducción Markdown e importaciones PySpark ejecutadas.'
  - '**Resultado esperado:** Cinco pedidos procesados y agregados en la vista temporal `etl_ventas_diarias`: 2 fechas,
    5 pedidos y ventas totales de 470.50.'
  - '**Resultado esperado:** Aserciones de 2 días, 5 pedidos y 470.50 aprobadas; el ETL se reejecuta sin cambios
    y el notebook queda guardado en Workspace.'
