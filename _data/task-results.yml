lab12:
  results:
  - '**Resultado esperado:** El notebook `12_benchmark_layout` reutiliza el clúster y configura AQE y shuffle; el
    esquema `dbricks_de_int.p12_performance_lab` incluye `benchmark_metrics` y `benchmark_recommendation`.'
  - '**Resultado esperado:** `events_source`, `events_partitioned_country` y `events_liquid` contienen 200,000 eventos
    equivalentes; el diseño estático usa `PARTITIONED BY (country)` y Liquid `CLUSTER BY (customer_id,event_date)`,
    con metadatos Delta consultables.'
  - '**Resultado esperado:** Las consultas Q1, Q2 y Q3 devuelven resultados equivalentes en ambos diseños; `benchmark_metrics`
    registra 24 ejecuciones de un mismo experimento: 6 warmups y 18 mediciones con duraciones observadas.'
  - '**Resultado esperado:** La comparación obtiene seis medianas reales, tres mediciones por combinación consulta-diseño,
    conteos de archivos y evidencia de Spark UI cuando está disponible, sin inventar tiempos de ejecución.'
  - '**Resultado esperado:** `benchmark_recommendation` conserva una recomendación condicionada por las tres comparaciones
    de medianas y un `experiment_id` real; quedan disponibles `events_liquid`, `benchmark_metrics` y la recomendación
    para la Práctica 13.'
lab13:
  results:
  - '**Resultado esperado:** `13_ajuste_costos` reutiliza `events_liquid` con 200,000 filas y las 24 mediciones
    de P12; registra configuración inicial y prepara `tuning_metrics`, fingerprint e ID del experimento.'
  - '**Resultado esperado:** El escenario baseline ejecuta AQE habilitado con 200 particiones shuffle, realiza un
    warmup separado y obtiene tres duraciones reales de la misma consulta SQL.'
  - '**Resultado esperado:** El escenario adjusted mantiene AQE habilitado y usa 64 particiones; completa un warmup
    y otras tres mediciones, con seis registros totales y un único fingerprint de consulta.'
  - '**Resultado esperado:** `tuning_metrics` contiene seis ejecuciones identificadas por `experiment_id` y UUID;
    se calculan medianas baseline/adjusted y variación porcentual real sin atribuir diferencias a factores no medidos.'
  - '**Resultado esperado:** Quedan documentadas las propiedades de cómputo y las horas de consulta, sin confundirlas
    con DBU o facturación; los costos permanecen pendientes si faltan tarifas y uso facturado, y AQE/shuffle vuelven
    a sus valores iniciales.'
